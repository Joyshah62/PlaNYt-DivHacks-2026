<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#15120e"/>
  <!-- Newspaper page, tilted -->
  <g transform="rotate(-12 32 32)">
    <!-- Paper -->
    <rect x="12" y="10" width="40" height="44" rx="2" fill="#f3ede1"/>
    <!-- Masthead bar -->
    <rect x="15" y="13" width="34" height="6" rx="1" fill="#15120e"/>
    <!-- Headline bars -->
    <rect x="15" y="22" width="20" height="3" rx="0.5" fill="#15120e"/>
    <rect x="15" y="27" width="34" height="2" rx="0.5" fill="#15120e" opacity="0.5"/>
    <!-- Column lines -->
    <rect x="15" y="31" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="15" y="34" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="15" y="37" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="15" y="40" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="15" y="43" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="34" y="31" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="34" y="34" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="34" y="37" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="34" y="40" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <rect x="34" y="43" width="15" height="1.5" rx="0.5" fill="#15120e" opacity="0.4"/>
    <!-- Column divider -->
    <line x1="32" y1="30" x2="32" y2="46" stroke="#15120e" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Location pin (red accent) -->
  <g transform="translate(36, 30)">
    <path d="M0-8C-4.4-8-8-4.4-8 0C-8 5.6 0 12 0 12S8 5.6 8 0C8-4.4 4.4-8 0-8Z" fill="#c8321f"/>
    <circle cx="0" cy="0" r="3" fill="#f3ede1"/>
  </g>
</svg>
